name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Accept SDK licenses non-interactively by writing license hash files
      # directly. This bypasses the interactive prompt that causes failures
      # with "android-actions/setup-android" and "yes | sdkmanager --licenses".
      # GitHub-hosted ubuntu-latest runners already have Android SDK pre-installed
      # at $ANDROID_HOME (/usr/local/lib/android/sdk).
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\ne9acab5b5fbb560a72cfaecbe81fb8f5a6a8c6b3" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/google-gdk-license
          echo "SDK licenses accepted successfully"

      # Install only the SDK packages actually required by the project.
      # Project requires: compileSdk = 34 (AGP 8.2.0, Kotlin 1.9.20)
      - name: Install required Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true
          echo "Required SDK packages installed"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK not found at expected path"
            echo "Contents of app/build/outputs/:"
            find app/build/outputs/ -type f 2>/dev/null || echo "outputs directory does not exist"
            exit 1
          fi
          echo "APK found successfully"
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
